    meaning: "turn interval for live replay frames; value 1 means dashboard can show every turn"
  live_replay_update_interval_turns:
    value: 1
    type: int
    allowed_min: 1
    allowed_max: 500
    unit: turns
    meaning: "how often the trainer rewrites latest telemetry with live replay progress"
  live_replay_slot_bytes:
    value: 131072
    type: int
    allowed_min: 4096
    allowed_max: 1048576
    unit: bytes
    meaning: "fixed payload capacity per live replay frame slot in preallocated .owslot storage; oversized frames fail visibly instead of falling back to JSON"

cuda_training:
  trainable_forward_abi:
    value: "orbit_wars_cuda_trainable_forward"
    type: string
    meaning: "C ABI entrypoint for host-buffer batched TrainableTransformer forward inference"
  true2d_forward_abi:
    value: "orbit_wars_cuda_true2d_forward"
    type: string
    meaning: "C ABI entrypoint for host-buffer batched True2DTransformer forward inference"
  true2d_forward_many_abi:
    value: "orbit_wars_cuda_true2d_forward_many"
    type: string
    meaning: "C ABI entrypoint for one CUDA batch containing many True2DTransformer models selected by model_id per input"
  true2d_upload_population_abi:
    value: "orbit_wars_cuda_true2d_upload_population"
    type: string
    meaning: "C ABI entrypoint that uploads all True2DTransformer population weights to persistent VRAM workspace once per population/archive"
  true2d_forward_many_resident_abi:
    value: "orbit_wars_cuda_true2d_forward_many_resident"
    type: string
    meaning: "C ABI entrypoint for many-model True2DTransformer forward inference using resident GPU population weights"
  true2d_batch_model_selector:
    value: "model_indices_per_input"
    type: string
    allowed_values: ["model_indices_per_input"]
    meaning: "CUDA batching contract: every packed input row group carries one model index selecting weights inside kernels"
  true2d_static_workspace_mode:
    value: "persistent_device_buffers_and_resident_population_resize_on_capacity_or_shape_change"
    type: string
    allowed_values: ["persistent_device_buffers_and_resident_population_resize_on_capacity_or_shape_change"]
    meaning: "CUDA true2d many-forward workspace contract; device buffers and uploaded population weights persist across turn forwards and reallocate only when capacity or shape changes"
  true2d_max_requests_per_forward:
    value: 8192
    type: int
    allowed_min: 1
    allowed_max: 65536
    unit: requests
    meaning: "maximum player-state requests per CUDA true2d many-forward call; full training may split a turn into explicit ordered chunks while preserving model_indices per request"
  true2d_cuda_library_path_env:
    value: "ORBIT_WARS_CUDA_LIB_PATH"
    type: env_var
